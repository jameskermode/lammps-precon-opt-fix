[project]
name = "lammps-precon-opt"
version = "0.1.0"
description = "Standalone Exp preconditioner for LAMMPS geometry optimisation, validated stage-by-stage against ASE."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ase==3.28.0",  # pinned: ASE's Exp preconditioner is the validation reference
    "numpy",
    "scipy",
    "pyamg",
    "matscipy",
    "h5py",
    "mace-torch",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lammps_precon"]

# CPU-only torch — this project does not need the ~2.5 GB CUDA torch wheel.
# (To hack on ASE itself, `uv pip install -e` a local ASE checkout.)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
