[project]
name = "lammps-precon-opt"
version = "0.1.0"
description = "Standalone Exp preconditioner for LAMMPS geometry optimisation, validated stage-by-stage against ASE."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ase",
    "numpy",
    "scipy",
    "pyamg",
    "matscipy",
    "h5py",
    "mace-torch",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lammps_precon"]

# Use the locally cloned ASE checkout (3.28.0, in ase-src/) so its Exp
# preconditioner source is explorable and is exactly the code the parity
# checks reuse. The directory is "ase-src" not "ase" to avoid shadowing the
# installed package when Python runs from the repo root.
[tool.uv.sources]
ase = { path = "ase-src", editable = true }
# CPU-only torch — this project does not need the ~2.5 GB CUDA torch wheel.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
